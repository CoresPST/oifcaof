<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classes - Grimório do Escritor</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: 'Georgia', serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 2.5em;
      margin-bottom: 10px;
    }
    .description {
      text-align: center;
      max-width: 700px;
      margin: 0 auto 40px auto;
      font-size: 1.1em;
      color: #ccc;
    }
    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .class-card {
      background-color: #222;
      padding: 15px;
      border-radius: 10px;
      transition: transform 0.3s;
    }
    .class-card:hover {
      transform: scale(1.02);
    }
    .class-card img {
      display: block;
      margin: 0 auto 10px;
      border-radius: 8px;
    }
    .class-title {
      font-size: 1.2em;
      text-align: center;
      margin-bottom: 10px;
    }
    .stats {
      font-size: 0.95em;
      line-height: 1.5;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>
  <h1>CLASSES</h1>
  <div class="description">
    As classes representam os estilos iniciais de combate e magia no mundo sombrio de <strong>Lord Of Three</strong>. Elas servem para definir seus atributos e magia no universo de Lord Of Three.
  </div>
  <div class="class-grid">

    <!-- Class cards would go here (omitted to shorten preview) -->

  </div>
</body>
</html>
