<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teste de Imagens - Classes</title>
  <style>
    body {
      background-color: #111;
      color: #eee;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .img-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }
    .img-container img {
      width: 200px;
      border-radius: 8px;
      border: 2px solid #444;
    }
  </style>
</head>
<body>
  <h1>Verificação de Imagens</h1>
  <div class="img-container">
    <!-- Classe: images-left -->
    <img alt="Left Aligned">
    
    <!-- Classe: images-right -->
    <img alt="Right Aligned">
    
    <!-- Classe: images-top -->
    <img alt="Top Aligned">
    
    <!-- Classe: images-bottom -->
    <img alt="Bottom Aligned">
    
    <!-- Classe: images-center -->
    <img alt="Center Aligned">
    
    <!-- Classe: images-hidden -->
    <img alt="Hidden Image">
    
    <!-- Classe: images-rotate -->
    <img alt="Rotated Image">
    
    <!-- Classe: images-fade -->
    <img alt="Faded Image">
    
    <!-- Classe: images-shadow -->
    <img alt="Image with Shadow">
    
    <!-- Classe: images-blur -->
    <img alt="Blurred Image">
  </div>
</body>
</html>
